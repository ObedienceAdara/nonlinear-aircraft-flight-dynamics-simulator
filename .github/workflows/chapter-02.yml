name: Chapter 02 CI

on:
  push:
    paths:
      - "chapter-02-euler-kinematics/**"
      - ".github/workflows/chapter-02.yml"
  pull_request:
    paths:
      - "chapter-02-euler-kinematics/**"
      - ".github/workflows/chapter-02.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chapter-02-euler-kinematics

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q

      - name: Run simulation smoke test
        run: python main.py
