name: Canonical FDM CI

on:
  push:
    paths:
      - "main.py"
      - "comparison/**"
      - "src/**"
      - "tests/**"
      - "studies/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/core.yml"
  pull_request:
    paths:
      - "main.py"
      - "comparison/**"
      - "src/**"
      - "tests/**"
      - "studies/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/core.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev,compare]"
      - run: pytest
      - run: python main.py
      - run: python comparison/jsbsim/run_comparison.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jsbsim-comparison-results-py${{ matrix.python-version }}
          path: comparison/jsbsim/results/
          if-no-files-found: warn
