name: Chapter 03 CI

on:
  push:
    paths:
      - "chapter-03-navigation-atmosphere-aerodynamics/**"
      - ".github/workflows/chapter-03.yml"
  pull_request:
    paths:
      - "chapter-03-navigation-atmosphere-aerodynamics/**"
      - ".github/workflows/chapter-03.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chapter-03-navigation-atmosphere-aerodynamics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python main.py
